apiVersion: v1
kind: Service
metadata:
  name: {{ include "air-gateway.fullname" . }}
  labels:
    {{- include "air-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "air-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: dashboard
      port: {{ .Values.service.dashboardPort }}
      targetPort: dashboard
