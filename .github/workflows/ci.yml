name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          go build ./cmd/gateway
          go build ./cmd/replayctl
          go build ./cmd/evidencectl
      - name: Test
        run: go test -race -count=1 -v ./...
      - name: Vet
        run: go vet ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Fuzz the request parser
        run: |
          for target in FuzzInferProvider FuzzExtractPromptText FuzzExtractToolNames FuzzExtractStreamTokens; do
            echo "::group::$target"
            go test ./pkg/proxy/ -run='^$' -fuzz="^${target}\$" -fuzztime=30s
            echo "::endgroup::"
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t air-blackbox-gateway .
