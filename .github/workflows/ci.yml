name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          go build ./cmd/gateway
          go build ./cmd/replayctl
          go build ./cmd/evidencectl
      - name: Test
        run: go test -race -count=1 -v ./...
      - name: Vet
        run: go vet ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t air-blackbox-gateway .

  python-package:
    # Builds the wheel the world installs, installs it clean, imports every
    # module, runs every CLI command. The gate that stops a broken package
    # reaching PyPI.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Run release check (build, install, import, run)
        run: bash scripts/release_check.sh
