name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          go build ./cmd/gateway
          go build ./cmd/replayctl
          go build ./cmd/evidencectl
      - name: Test
        run: go test -race -count=1 -v ./...
      - name: Vet
        run: go vet ./...

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # Install the package itself so runtime deps come from pyproject and
        # can't drift from what the code imports; extras cover the optional
        # features the suite exercises (mcp -> mcp+pyjwt, lake -> pyarrow).
        run: pip install -e ".[mcp,lake]" pytest
      - name: Test SDK
        run: PYTHONPATH=sdk python -m pytest tests/ sdk/tests/ -q

  # The same suite with the pqc extra installed, so the ML-DSA-65 signing
  # path (receipts, tenant key persistence, bundle verification) runs under
  # real post-quantum crypto instead of silently falling back to Ed25519.
  # pqcrypto ships prebuilt wheels, so this adds no native build time. (#63)
  python-test-pqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (with post-quantum provider)
        run: pip install -e ".[mcp,lake,pqc]" pytest
      - name: Assert ML-DSA-65 is actually active
        # Guard against the extra quietly failing to install: this job's whole
        # point is exercising the PQ path, so refuse to run "green" without it.
        run: |
          PYTHONPATH=sdk python -c "
          from air_blackbox.gate.receipt import HAS_MLDSA65, ReceiptSigner
          assert HAS_MLDSA65, 'pqc extra installed but ML-DSA-65 unavailable'
          assert ReceiptSigner().method == 'ML-DSA-65'
          print('ML-DSA-65 active')
          "
      - name: Test SDK (post-quantum)
        run: PYTHONPATH=sdk python -m pytest tests/ sdk/tests/ -q

  # The TypeScript package. Its differential tests check that the Python SDK
  # verifies what it writes and vice versa, so the SDK is installed and
  # AIR_REQUIRE_PYTHON turns a missing Python into a failure, not a skip.
  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python SDK (for differential tests)
        working-directory: .
        run: pip install -e .
      - run: npm ci
      - name: Test
        env:
          AIR_PYTHON: python
          AIR_REQUIRE_PYTHON: "1"
          PYTHONPATH: ${{ github.workspace }}/sdk
          # Enough records that an export holding them all would run out of
          # the scale test's 160 MB heap.
          AIR_SCALE_TEST: "20000"
        run: npm test

  # The oldest framework majors the peer ranges claim, run through the hooks.
  js-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: ai@5.0.277
            run: node scripts/compat-vercel-ai.mjs
          - pkg: ai@6.0.308
            run: node scripts/compat-vercel-ai.mjs
          - pkg: "@langchain/core@0.3.80"
            run: node --test dist/test/langchain.test.js
          - pkg: "@openai/agents@0.17.2"
            run: node --test dist/test/openai-agents.test.js
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
      - run: npm install --no-save "${{ matrix.pkg }}"
      - run: ${{ matrix.run }}

  fuzz:
    runs-on: ubuntu-latest
    # 4 targets x 30s of fuzzing is ~4 minutes with setup. A cap turns a
    # runner reaped mid-queue (which reports as a red X with no steps and no
    # logs, indistinguishable from a real failure) into an explicit timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Fuzz the request parser
        run: |
          for target in FuzzInferProvider FuzzExtractPromptText FuzzExtractToolNames FuzzExtractStreamTokens; do
            echo "::group::$target"
            go test ./pkg/proxy/ -run='^$' -fuzz="^${target}\$" -fuzztime=30s
            echo "::endgroup::"
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t air-blackbox-gateway .
