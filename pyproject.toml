[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-blackbox"
version = "1.15.0"
description = "AI governance control plane - compliance, inventory, incident response, and audit for AI agents"
readme = "sdk/README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Jason Shotwell", email = "jason.j.shotwell@gmail.com"},
]
keywords = [
    "ai", "governance", "compliance", "eu-ai-act", "audit",
    "opentelemetry", "llm", "ai-agents", "aibom", "shadow-ai",
    "gdpr", "prompt-injection", "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
crewai = ["crewai>=0.50.0"]
haystack = ["haystack-ai>=2.0.0"]
openai = ["openai>=1.0"]
autogen = ["autogen-agentchat>=0.4.0"]
adk = ["google-adk>=0.1.0"]
claude = ["claude-agent-sdk>=0.1.0"]
pdf = ["reportlab>=4.0"]
gate = ["cryptography>=42.0"]
lake = ["pyarrow>=14.0"]  # Parquet lake sink + in-lake chain verification
mcp = ["mcp>=1.0,<2", "pyjwt>=2.8"]  # governance MCP server for Claude (record/enforce/prove); <2: mcp 2.0 removed mcp.server.fastmcp (see #59 follow-up)
monitor = ["sentry-sdk>=2.0"]  # optional error tracking for hosted deployments; engaged only when SENTRY_DSN is set
# Post-quantum ML-DSA-65 signing (opt-in). pqcrypto wraps PQClean and ships
# prebuilt wheels, so this installs (and is CI-testable) without a native
# toolchain. NOTE: the previous pin here ("oqs") was the WRONG PyPI package -
# an unrelated project; liboqs-python is still honored as a fallback provider
# if already installed. See #63.
pqc = ["pqcrypto>=0.4.0"]
all = [
    "air-blackbox[langchain]",
    "air-blackbox[crewai]",
    "air-blackbox[haystack]",
    "air-blackbox[openai]",
    "air-blackbox[autogen]",
    "air-blackbox[claude]",
    "air-blackbox[pdf]",
    "air-blackbox[gate]",
    "air-blackbox[lake]",
    "air-blackbox[mcp]",
    "air-blackbox[pqc]",
]

[project.scripts]
air-blackbox = "air_blackbox.cli:main"
air-blackbox-comply-strict = "air_blackbox.precommit:main"
air-blackbox-mcp = "air_blackbox.mcp_server:main"
air-evidence = "air_blackbox.evidence_verify:main"

[project.urls]
Homepage = "https://airblackbox.ai"
Repository = "https://github.com/airblackbox/airblackbox"
Documentation = "https://github.com/airblackbox/airblackbox/tree/main/docs"
Issues = "https://github.com/airblackbox/airblackbox/issues"

[tool.setuptools.packages.find]
where = ["sdk"]

[tool.setuptools.package-data]
air_blackbox = ["export/mappings/*.json", "gate/examples/*.yaml",
                "mcp_assets/*"]
"air_blackbox.aibom" = ["ai_libraries.yaml"]

[tool.setuptools.package-dir]
"" = "sdk"
