# Governance MCP server (air-mcp / mcp.airblackbox.ai).
#
# This file lives at the REPO ROOT on purpose: a bare `fly deploy` from the
# root must deploy the MCP server. Before this file was committed, a bare
# `fly deploy -a air-mcp` fell through to the root Dockerfile - which builds
# the Go GATEWAY - and replaced the production MCP image with it, taking
# mcp.airblackbox.ai down until the next correct deploy. The right build is
# not allowed to depend on remembering a -c flag.
#
#   fly deploy                              # from repo root - that's it
#
# First-time setup:
#   fly volumes create air_data --size 1
#   fly secrets set TRUST_SIGNING_KEY=$(openssl rand -hex 32)
#   fly certs add mcp.airblackbox.ai
#   # DNS: CNAME  mcp.airblackbox.ai -> air-mcp.fly.dev
#
# Then in claude.ai: Settings -> Connectors -> Add custom connector
#   URL: https://mcp.airblackbox.ai/mcp

app = "air-mcp"
primary_region = "iad"

[build]
  dockerfile = "deploy/mcp/Dockerfile"

[env]
  AIR_MCP_TRANSPORT = "http"
  AIR_MCP_PORT = "8085"
  AIR_RUNS_DIR = "/data/runs"
  # The OAuth issuer claude.ai discovers during connector setup — points at
  # the IdP (WorkOS AuthKit), not at this server.
  AIR_MCP_ISSUER_URL = "https://active-midnight-15-staging.authkit.app"
  # This server's own identity in the discovery document (RFC 9728
  # "resource"). Must match AIR_MCP_JWT_AUDIENCE so tokens requested for
  # this resource pass the audience pin.
  AIR_MCP_RESOURCE_URL = "https://mcp.airblackbox.ai"
  # Hosts the server trusts (DNS-rebinding protection). Include the raw
  # fly.dev hostname so you can test before the custom domain is wired.
  AIR_MCP_ALLOWED_HOSTS = "air-mcp.fly.dev,mcp.airblackbox.ai"
  AIR_COVENANT = "/app/sdk/air_blackbox/gate/examples/recruiting-screener.covenant.yaml"
  # Evidence must not depend on a busy human asking: every tenant with new
  # records gets a fresh signed bundle on this interval, written to the
  # volume (deployer-controlled storage).
  AIR_AUTO_EXPORT_INTERVAL_HOURS = "24"
  #
  # OAuth (resource-server). Until one of the modes below is enabled, the
  # server runs OPEN: anyone with the URL shares one tenant. Demo only.
  #
  # Production (JWKS - works with WorkOS AuthKit, Auth0, Okta; claude.ai
  # needs the IdP to support Dynamic Client Registration):
  #   fly secrets set AIR_MCP_JWKS_URL=https://YOUR-IDP/.well-known/jwks.json
  #   fly secrets set AIR_MCP_JWT_ISSUER=https://YOUR-IDP
  #   fly secrets set AIR_MCP_JWT_AUDIENCE=https://mcp.airblackbox.ai
  # and point AIR_MCP_ISSUER_URL above at the IdP so claude.ai can discover
  # it through /.well-known/oauth-protected-resource.
  #
  # Alternative (RFC 7662 introspection, e.g. Keycloak):
  #   fly secrets set AIR_MCP_INTROSPECTION_URL=https://YOUR-IDP/oauth/introspect
  #   fly secrets set AIR_MCP_INTROSPECTION_AUTH="Basic <base64 client:secret>"
  # Self-host without an IdP (programmatic clients, not the claude.ai UI):
  #   fly secrets set AIR_MCP_TOKENS="tok1:recruiter-a,tok2:recruiter-b"

[mounts]
  source = "air_data"
  destination = "/data"

# SINGLE WRITER - never scale this app above ONE machine. The audit chain
# is single-writer by design: the ingest endpoint's file lock serializes
# writers on one machine but cannot reach across two, and two machines with
# separate volumes don't fork the chain so much as start a second one -
# unrecoverably. `fly scale count 1` is the enforced state; an autoscale or
# count change here silently reintroduces exactly that failure. See the
# /ingest handler in sdk/air_blackbox/mcp_server.py for the full argument.
[http_service]
  internal_port = 8085
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

  # /health write-probes the runs volume, so a failing check means "cannot
  # record evidence" (full/unmounted/read-only volume, wedged process) and
  # Fly restarts the machine instead of routing traffic into a black hole.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"
